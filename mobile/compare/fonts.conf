<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The mobile comparisons draw Roboto on both sides: Flutter loads the same
     files in its golden tests (mobile/mockups/flutter/test/render_test.dart),
     and this sends RUI's "sans-serif" to it too. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>Sans</family><prefer><family>Roboto</family><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
