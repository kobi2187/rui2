name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: nim check (packages + examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 'stable'

      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango1.0-dev libcairo2-dev \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev \
            libxkbcommon-dev libwayland-bin

      - name: Install dependencies
        run: nimble install -y naylib yaml

      - name: Type-check every package barrel
        run: |
          set -euo pipefail
          NAYLIB="$(nimble path naylib | tail -1)"
          YAML="$(nimble path yaml | tail -1)"
          PATHS="--path:$NAYLIB --path:$YAML"          # config.nims adds the in-repo package paths
          rc=0
          for p in rui_core rui_hittest rui_events rui_drawing rui_scripting rui_widgets rui; do
            echo "::group::nim check $p"
            nim check --hints:off --warnings:off $PATHS "packages/$p/src/$p.nim" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Compile every example
        run: |
          set -euo pipefail
          NAYLIB="$(nimble path naylib | tail -1)"
          YAML="$(nimble path yaml | tail -1)"
          PATHS="--path:$NAYLIB --path:$YAML"
          rc=0
          # A real compile, not just `nim check`: naylib's move-only GPU types
          # (`=copy` is {.error.}) only fail during the full build, so a
          # check-only CI passes code that cannot actually link.
          for f in examples/*.nim examples/baby/*.nim; do
            echo "::group::nim c $f"
            nim c --hints:off --warnings:off -d:useGraphics $PATHS \
              --nimcache:"/tmp/nc/$(basename "$f" .nim)" \
              -o:"/tmp/bin/$(basename "$f" .nim)" "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Run the UI test suite
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq xvfb imagemagick
          NAYLIB="$(nimble path naylib | tail -1)"
          YAML="$(nimble path yaml | tail -1)"
          nim c --hints:off --warnings:off -d:useGraphics \
            --path:"$NAYLIB" --path:"$YAML" examples/pango_showcase.nim
          ./tools/ui_test.sh ./examples/pango_showcase
