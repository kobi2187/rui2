name: CI

# Pull requests, and main after a merge. (Running on every push as well ran
# each PR commit twice.) A newer push to the same branch cancels the old run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Three jobs in parallel, each running one stage of tools/run_tests.sh -- the
# same script a contributor runs, so a red job reproduces locally with the
# same command.
jobs:
  unit:
    name: unit tests + GL checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {cache-key: unit, xvfb: 'true'}
      - run: ./tools/run_tests.sh quick

  examples:
    name: packages + examples (Nim backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {cache-key: examples}
      - name: Type-check every package barrel
        run: |
          set -euo pipefail
          PATHS="--path:$(nimble path naylib | tail -1) --path:$(nimble path yaml | tail -1)"
          rc=0
          for p in rui_core rui_hittest rui_events rui_drawing rui_scripting rui_widgets rui; do
            nim check --hints:off --warnings:off $PATHS "packages/$p/src/$p.nim" || rc=1
          done
          exit $rc
      - run: ./tools/run_tests.sh examples

  ui:
    name: scripted UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {cache-key: ui, xvfb: 'true'}
      - run: ./tools/run_tests.sh ui

  layout:
    name: layout snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: {cache-key: layout}
      - name: Cache snapshot builds
        uses: actions/cache@v4
        with:
          path: /tmp/rui2_snap
          key: snap-${{ runner.os }}-${{ github.sha }}
          restore-keys: snap-${{ runner.os }}-
      - run: ./tools/layout_snapshot.sh check
